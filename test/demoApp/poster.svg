<?xml version="1.0" standalone="no"?>
<svg width="770" height="630" viewBox="0 0 770 630" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <style>
    .layerRectangle {
      stroke: black;
      stroke-dasharray: 5,5;
      fill: url('#layers')
    }
    .layerText {
      fill: purple;
      font-size: 150%;
      filter: url(#outlineWhite);
    }
    .nodeFolder {
      fill: #aaaaaa;
      opacity: 0.3;
      stroke: whitesmoke;
    }
    .nodeFile {
      fill: #ffffff;
      opacity: 0.9;
      stroke: gray;
    }
    .nodeFileOrphan {
      fill: #ff6b6b !important;
      opacity: 0.9;
      stroke: gray;
    }
    .folderName {
      font-size: 180%;
      fill : white;
      font-weight: bolder;
      text-anchor: start;
      letter-spacing : 1px;
      dominant-baseline: hanging;
      filter: url(#shadow);
    }
    .nodeName {
      fill : black;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
      filter: url(#outlineWhite);
    }
    .line {
      fill : none;
      stroke: #377E22;
      stroke-width: 3;
      opacity: 0.5;
    }
    .line:hover {
      stroke-width: 6;
      opacity: 1;
    }
    .lineOrange {
      fill : none;
      stroke: #F09235;
      stroke-width: 8;
      opacity: 0.5;
    }
    .lineOrange:hover {
      stroke-width: 13;
      opacity: 1;
    }
    .lineRed {
      fill : none;
      stroke: #EB4132;
      stroke-width: 8;
      opacity: 0.5;
    }
    .lineRed:hover {
      stroke-width: 13;
      opacity: 1;
    }
</style>
  <defs id='idSvgDef'>
    <linearGradient id="layers" gradientTransform="rotate(90)">
      <stop offset="0%" stop-color="#691872" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#691872" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feFlood flood-color="black"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outlineWhite">
      <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="2"/>
      <feFlood flood-color="white" flood-opacity="0.5" result="WHITE"/>
      <feComposite in="WHITE" in2="DILATED" operator="in" result="OUTLINE"/>
      <feMerge>
        <feMergeNode in="OUTLINE" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="outlineBlack">
      <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="2"/>
      <feFlood flood-color="black" flood-opacity="0.5" result="BLACK"/>
      <feComposite in="BLACK" in2="DILATED" operator="in" result="OUTLINE"/>
      <feMerge>
        <feMergeNode in="OUTLINE"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id='lineEnd' viewBox= '0 -5 30 10' refX='12' orient='auto'>
