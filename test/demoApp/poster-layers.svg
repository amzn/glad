<?xml version="1.0" standalone="no"?>
<svg width="1000" height="550" viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <style>
    .layerRectangle {
      stroke: black;
      stroke-dasharray: 5,5;
      fill: url('#layers')
    }
    .layerText {
      fill: purple;
      font-size: 150%;
      filter: url(#outlineWhite);
    }
    .nodeFolder {
      fill: #aaaaaa;
      opacity: 0.3;
      stroke: whitesmoke;
    }
    .nodeFile {
      fill: #ffffff;
      opacity: 0.9;
      stroke: gray;
    }
    .nodeFileOrphan {
      fill: #ff6b6b !important;
      opacity: 0.9;
      stroke: gray;
    }
    .folderName {
      font-size: 180%;
      fill : white;
      font-weight: bolder;
      text-anchor: start;
      letter-spacing : 1px;
      dominant-baseline: hanging;
      filter: url(#shadow);
    }
    .nodeName {
      fill : black;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
      filter: url(#outlineWhite);
    }
    .line {
      fill : none;
      stroke: #377E22;
      stroke-width: 3;
      opacity: 0.5;
    }
    .line:hover {
      stroke-width: 6;
      opacity: 1;
    }
    .lineOrange {
      fill : none;
      stroke: #F09235;
      stroke-width: 8;
      opacity: 0.5;
    }
    .lineOrange:hover {
      stroke-width: 13;
      opacity: 1;
    }
    .lineRed {
      fill : none;
      stroke: #EB4132;
      stroke-width: 8;
      opacity: 0.5;
    }
    .lineRed:hover {
      stroke-width: 13;
      opacity: 1;
    }
</style>
  <defs id='idSvgDef'>
